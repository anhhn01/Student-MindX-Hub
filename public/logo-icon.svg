<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="mindxRed1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="mindxRed2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="mindxAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="mindxDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#0D1117" stroke="#E11D48" stroke-width="16" filter="url(#shadow)" />

  <!-- Inner Content Group Scaled (100 -> 512) -->
  <g transform="translate(16, 16) scale(4.8)">
    <!-- Top Left wing -->
    <polygon points="24,20 46,20 34,46 16,36" fill="url(#mindxRed1)" />
    <!-- Top Right wing -->
    <polygon points="76,20 54,20 66,46 84,36" fill="url(#mindxAmber)" />
    <!-- Center diamond core -->
    <polygon points="50,38 64,50 50,62 36,50" fill="#FFFFFF" opacity="0.95" />
    <polygon points="50,42 58,50 50,58 42,50" fill="url(#mindxRed1)" />
    <!-- Bottom Left wing -->
    <polygon points="16,64 34,54 46,80 24,80" fill="url(#mindxDark)" />
    <!-- Bottom Right wing -->
    <polygon points="84,64 66,54 54,80 76,80" fill="url(#mindxRed2)" />
    <!-- Dynamic Center Dot -->
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
